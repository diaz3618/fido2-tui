[package]
name = "fido2-tui"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Diaz Santiago <daniel.diaz.stg@gmail.com>"]
description = "Terminal UI for managing FIDO2 security keys: passkeys, PIN, fingerprints, SSH and LUKS2 unlock"
license-file = "LICENSE"
repository = "https://github.com/diaz3618/fido2-tui"

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1.8"

